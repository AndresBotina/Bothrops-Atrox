[project]
name = "valuebet"
version = "0.1.0"
description = "Sistema personal de detección de valor en apuestas de fútbol"
requires-python = ">=3.12"
readme = "README.md"

# Dependencias de runtime necesarias para Fase 0 y Fase 1.
# Las de fases posteriores (modelado, API) van en optional-dependencies.
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",      # driver Postgres (psycopg3)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",    # carga de settings desde .env / entorno
    "httpx>=0.27",               # cliente HTTP para adapters
    "tenacity>=8.4",             # reintentos con backoff (HU 1.1.2)
    "structlog>=24.1",           # logging estructurado (HU 0.2.2)
    "typer>=0.12",               # CLI de orquestación (HU 1.5.1)
    "pandas>=2.2",
    "polars>=1.0",
    "pandera>=0.20",             # contratos de datos sobre DataFrames (HU 1.6.1)
]

[project.optional-dependencies]
# Fase 3: motor estadístico Dixon-Coles.
modeling = [
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
]
# Fases 4-5: API que sirve dashboard y predicciones.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

# Dependencias de desarrollo (PEP 735, soportado por uv).
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valuebet"]

# ---------------------------------------------------------------------------
# Ruff: lint + formato
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",    # pycodestyle / pyflakes
    "I",         # isort (orden de imports)
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "C4",        # comprehensions
]

# Las migraciones las genera Alembic desde una plantilla: traen imports que no
# siempre se usan (op/sa) y tipado heredado. No tiene sentido editarlas a mano,
# así que relajamos esas reglas sólo dentro de migrations/versions.
[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "F401", "I", "UP"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
markers = [
    "integration: pruebas que requieren una Postgres real (migraciones, sesión).",
]

# ---------------------------------------------------------------------------
# Mypy (gradual; se endurece con el tiempo)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
